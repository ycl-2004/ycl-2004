<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 116" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Off the clock</title>
  <desc id="desc">Music and visual stories. A link to YC's creative portfolio, not an audio player.</desc>
  <style>
    .surface{fill:#FAF8F5;stroke:#E8E2D9}.ink{fill:#252638}.muted{fill:#626576}.accent{fill:#B23A48}
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .groove{stroke:#626576;stroke-width:1;opacity:.55}
    .record{transform-origin:58px 58px;animation:turn 4s ease-out 1}
    @keyframes turn{from{transform:rotate(-100deg)}to{transform:rotate(0)}}
    @media(prefers-color-scheme:dark){.surface{fill:#161B22;stroke:#30363D}.ink{fill:#E6EDF3}.muted{fill:#A6AFBC}.accent{fill:#F08E98}}
    @media(max-width:400px){text.ink{font-size:28px}text.muted{font-size:20px}}
    @media(prefers-reduced-motion:reduce){.record{animation:none}}
  </style>
  <rect class="surface" x=".5" y=".5" width="639" height="115" rx="12"/>
  <g class="record">
    <circle cx="58" cy="58" r="38" fill="#2B2D42"/>
    <circle class="groove" cx="58" cy="58" r="31"/>
    <circle class="groove" cx="58" cy="58" r="24"/>
    <circle class="accent" cx="58" cy="58" r="14"/>
    <path d="M57 48h2v9h-2z" fill="#FAF8F5"/>
    <circle cx="58" cy="58" r="3" fill="#FAF8F5"/>
  </g>
  <text class="accent" x="118" y="30" font-size="12" font-weight="700" letter-spacing="2">OFF THE CLOCK</text>
  <text class="ink" x="118" y="59" font-size="24" font-weight="700">A different kind of making.</text>
  <text class="muted" x="118" y="85" font-size="16">Music &amp; visual stories</text>
  <text class="accent" x="610" y="65" font-size="30" text-anchor="end">↗</text>
</svg>
