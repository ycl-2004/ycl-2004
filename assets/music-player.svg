<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">YC music desk — Late Night Synthesis</title>
  <desc id="desc">Ambient and lo-fi textures, Logic Pro and guitar. Animated record and decorative sound visualizer. Follow the image link to YC's creative portfolio.</desc>
  <style>
    .surface{fill:#FFFDF8;stroke:#E3DDD0}.ink{fill:#1A1A2E}.muted{fill:#626272}.wine{fill:#B23A48}.denim{fill:#3B6EA5}.blush{fill:#CB5A78}.pill{fill:#F4D9DC}
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .groove{stroke:#626272;stroke-width:1;opacity:.55}
    .record{transform-origin:76px 78px;animation:spin 12s linear infinite}
    .bar{transform-box:fill-box;transform-origin:center bottom;animation:beat 1.6s ease-in-out infinite alternate}
    .b2{animation-delay:-.6s;animation-duration:1.2s}.b3{animation-delay:-1.1s;animation-duration:1.9s}.b4{animation-delay:-.3s;animation-duration:1.4s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes beat{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
    @media(prefers-color-scheme:dark){.surface{fill:#151821;stroke:#4A4A5A}.ink{fill:#FFFDF8}.muted{fill:#CEC8B9}.wine{fill:#D98A94}.denim{fill:#9DBDE0}.blush{fill:#ECB2C0}.pill{fill:#4E1820}}
    @media(max-width:440px){.gear,.format,.eyebrow{display:none}.main-title{font-size:32px}.genre{font-size:23px}.subtitle{font-size:21px}}
    @media(prefers-reduced-motion:reduce){.record,.bar{animation:none}}
  </style>
  <rect class="surface" x=".75" y=".75" width="718.5" height="170.5" rx="14"/>
  <g class="record">
    <circle cx="76" cy="78" r="51" fill="#1A1A2E"/>
    <circle class="groove" cx="76" cy="78" r="43"/><circle class="groove" cx="76" cy="78" r="35"/><circle class="groove" cx="76" cy="78" r="27"/>
    <path d="M40 58a41 41 0 0 1 24-18M89 116a41 41 0 0 0 25-24" stroke="#9DBDE0" stroke-width="3" opacity=".4" stroke-linecap="round"/>
    <circle class="wine" cx="76" cy="78" r="18"/>
    <text x="76" y="73" text-anchor="middle" fill="#FFFDF8" font-size="9" font-weight="700">YC</text>
    <circle cx="76" cy="81" r="3" fill="#FFFDF8"/>
  </g>
  <path d="M126 34v24l-20 29" stroke="#9DBDE0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="126" cy="34" r="5" fill="#3B6EA5"/>
  <text class="wine eyebrow" x="156" y="30" font-size="11" font-weight="700" letter-spacing="1.8">YC / AFTER HOURS</text>
  <text class="ink main-title" x="156" y="65" font-size="28" font-weight="700">Late Night Synthesis</text>
  <text class="muted genre" x="156" y="93" font-size="18">Ambient &amp; Lo-Fi textures</text>
  <g class="gear">
    <rect class="pill" x="156" y="108" width="143" height="23" rx="6"/>
    <text class="wine" x="169" y="124" font-size="12" font-weight="600">Logic Pro + Guitar</text>
  </g>
  <text class="muted subtitle" x="24" y="153" font-size="12">From Swift &amp; AppKit to soundscapes.</text>
  <g transform="translate(562 42)">
    <rect class="wine bar" x="0" y="22" width="6" height="36" rx="3"/><rect class="denim bar b2" x="12" y="12" width="6" height="46" rx="3"/>
    <rect class="blush bar b3" x="24" y="0" width="6" height="58" rx="3"/><rect class="wine bar b4" x="36" y="15" width="6" height="43" rx="3"/>
    <rect class="denim bar b3" x="48" y="7" width="6" height="51" rx="3"/><rect class="blush bar b2" x="60" y="20" width="6" height="38" rx="3"/>
    <rect class="wine bar" x="72" y="4" width="6" height="54" rx="3"/><rect class="denim bar b4" x="84" y="17" width="6" height="41" rx="3"/>
  </g>
  <text class="muted format" x="610" y="125" text-anchor="middle" font-size="11">44.1 kHz · 24-bit</text>
  <text class="wine" x="694" y="153" text-anchor="end" font-size="22">↗</text>
</svg>
