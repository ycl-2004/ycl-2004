<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 82" fill="none" role="img">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ink { fill: #1A1A2E; }
    .muted { fill: #626272; }
    .a-denim { fill: #3B6EA5; stroke: #3B6EA5; }
    .s-denim { fill: #DCE7F2; }
    .anim { animation: pulse 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E6EDF3; }
      .muted { fill: #8B949E; }
      .a-denim { fill: #9DBDE0; stroke: #9DBDE0; }
      .s-denim { fill: #1F3550; }
    }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>
  <g class="anim">
    <path class="a-denim" fill="none" stroke-width="1.4" transform="translate(50 14) scale(0.65)" d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z" />
  </g>
  <text class="ink" x="2" y="20" font-size="17" font-weight="800" letter-spacing="-0.4">Wisp</text>
  <text class="muted" x="2" y="40" font-size="12.5">Context-aware AI assistant. Reads screen &amp; browser on demand.</text>
  <rect class="s-denim" x="2" y="54" width="42" height="19" rx="4.5" />
  <text class="a-denim" x="23.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">Swift</text>
  <rect class="s-denim" x="50" y="54" width="52" height="19" rx="4.5" />
  <text class="a-denim" x="76.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">SwiftUI</text>
  <rect class="s-denim" x="108" y="54" width="46" height="19" rx="4.5" />
  <text class="a-denim" x="131.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">macOS</text>
</svg>