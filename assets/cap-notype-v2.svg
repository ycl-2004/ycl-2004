<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 82" fill="none" role="img">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ink { fill: #1A1A2E; }
    .muted { fill: #626272; }
    .a-wine { fill: #B23A48; stroke: #B23A48; }
    .s-wine { fill: #F4D9DC; }
    .anim { animation: pulse 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E6EDF3; }
      .muted { fill: #8B949E; }
      .a-wine { fill: #F08E98; stroke: #F08E98; }
      .s-wine { fill: #4E1820; }
    }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>
  <text class="ink" x="202" y="22" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-0.4">NoType</text>
  <g class="anim">
    <path class="a-wine" fill="none" stroke-width="1.4" transform="translate(244 15) scale(0.65)" d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z" />
  </g>
  <text class="muted" x="210" y="41" text-anchor="middle" font-size="12.5">Private, local macOS dictation. Mixed Chinese &amp; English.</text>
  <rect class="s-wine" x="119.0" y="54" width="42" height="19" rx="4.5" />
  <text class="a-wine" x="140.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">Swift</text>
  <rect class="s-wine" x="167.0" y="54" width="72" height="19" rx="4.5" />
  <text class="a-wine" x="203.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">WhisperKit</text>
  <rect class="s-wine" x="245.0" y="54" width="56" height="19" rx="4.5" />
  <text class="a-wine" x="273.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">Core ML</text>
</svg>