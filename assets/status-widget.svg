<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 54" width="100%" height="54" fill="none">
  <defs>
    <style>
      .status-bg { fill: #FAF8F5; stroke: #E8E2D9; stroke-width: 1.2; }
      .prompt-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #B23A48; }
      .cmd-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; fill: #2B2D42; }
      .cursor { fill: #B23A48; animation: blink 1s step-start infinite; }
      .meta-pill { fill: #F0EAE1; }
      .meta-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #5C6274; }
      .pulse-dot { fill: #2DA44E; animation: pulse 2s ease-in-out infinite; }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      @media (prefers-color-scheme: dark) {
        .status-bg { fill: #161B22; stroke: #30363D; }
        .prompt-text { fill: #FF7B72; }
        .cmd-text { fill: #E6EDF3; }
        .cursor { fill: #FF7B72; }
        .meta-pill { fill: #21262D; }
        .meta-text { fill: #8B949E; }
        .pulse-dot { fill: #3FB950; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="838" height="52" rx="12" class="status-bg" />

  <!-- macOS Traffic Lights -->
  <circle cx="24" cy="27" r="5.5" fill="#ED6A5E" />
  <circle cx="42" cy="27" r="5.5" fill="#F4BF4F" />
  <circle cx="60" cy="27" r="5.5" fill="#61C554" />

  <!-- Monospace Terminal Prompt -->
  <text x="80" y="32" class="prompt-text">yc@station</text>
  <text x="164" y="32" class="cmd-text">% building on-device AI &amp; agentic systems</text>
  <rect x="496" y="20" width="8" height="15" class="cursor" rx="1" />

  <!-- Right Meta Pills -->
  <g transform="translate(565, 15)">
    <!-- AI Focus Pill -->
    <rect x="0" y="0" width="138" height="24" rx="12" class="meta-pill" />
    <circle cx="12" cy="12" r="3.5" class="pulse-dot" />
    <text x="22" y="16" class="meta-text">ON-DEVICE AI · AGENTS</text>

    <!-- Transition Badge -->
    <rect x="146" y="0" width="112" height="24" rx="12" class="meta-pill" />
    <text x="156" y="16" class="meta-text">UBC EE ➔ AI R&amp;D</text>
  </g>
</svg>
