<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 58" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">On the workbench</title>
  <desc id="desc">On-device AI and agent memory. YC's current areas of exploration.</desc>
  <style>
    .surface{fill:#FAF8F5;stroke:#E8E2D9}.label{fill:#B23A48}.text{fill:#2B2D42}
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px}
    .cursor{fill:#B23A48;animation:blink 1s step-end 4}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-color-scheme:dark){.surface{fill:#161B22;stroke:#30363D}.label,.cursor{fill:#F08E98}.text{fill:#E6EDF3}}
    @media(max-width:400px){text{font-size:23px}.label{font-size:19px}.cursor{display:none}text:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
  <rect class="surface" x=".5" y=".5" width="639" height="57" rx="10"/>
  <text class="label" x="20" y="35" font-weight="700">~/building</text>
  <text class="text" x="120" y="35">Local AI · Agent memory</text>
  <rect class="cursor" x="315" y="22" width="7" height="16" rx="1"/>
  <text class="label" x="617" y="35" text-anchor="end" font-size="12">IN PROGRESS</text>
</svg>
