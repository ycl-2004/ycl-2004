<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 82" fill="none" role="img">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ink { fill: #1A1A2E; }
    .muted { fill: #626272; }
    .a-blush { fill: #CB5A78; stroke: #CB5A78; }
    .s-blush { fill: #F6D7DE; }
    .anim { animation: pulse 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E6EDF3; }
      .muted { fill: #8B949E; }
      .a-blush { fill: #ECB2C0; stroke: #ECB2C0; }
      .s-blush { fill: #4A2030; }
    }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>
  <text class="ink" x="202" y="22" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="-0.4">FoldPeek</text>
  <g class="anim">
    <path class="a-blush" fill="none" stroke-width="1.4" transform="translate(248 15) scale(0.65)" d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z" />
  </g>
  <text class="muted" x="210" y="41" text-anchor="middle" font-size="12.5">Preview files inside Finder Quick Look without opening windows.</text>
  <rect class="s-blush" x="124.0" y="54" width="42" height="19" rx="4.5" />
  <text class="a-blush" x="145.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">Swift</text>
  <rect class="s-blush" x="172.0" y="54" width="50" height="19" rx="4.5" />
  <text class="a-blush" x="197.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">AppKit</text>
  <rect class="s-blush" x="228.0" y="54" width="68" height="19" rx="4.5" />
  <text class="a-blush" x="262.0" y="67" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600">Quick Look</text>
</svg>