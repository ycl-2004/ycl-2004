<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 172" fill="none" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.ink{fill:#1A1A2E}.muted{fill:#626272}.a-blush{fill:#CB5A78;stroke:#CB5A78}.s-blush{fill:#F6D7DE}.anim{animation:pulse 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes pulse{from{opacity:.35}to{opacity:1}}@media(prefers-color-scheme:dark){.ink{fill:#FFFDF8}.muted{fill:#CEC8B9}.a-blush{fill:#ECB2C0;stroke:#ECB2C0}.s-blush{fill:#4A2030}}@media(prefers-reduced-motion:reduce){.anim{animation:none}}</style><g class="anim"><path class="a-blush" fill="none" stroke-width="1.5" transform="translate(272 38) scale(1.15)" d="M0 -11 L2.8 -2.8 L11 0 L2.8 2.8 L0 11 L-2.8 2.8 L-11 0 L-2.8 -2.8 Z"/></g><text class="ink" x="8" y="52" font-size="47" font-weight="800" letter-spacing="-0.5">FoldPeek</text><text class="muted" x="8" y="94" font-size="29">Browse folders and preview files directly inside</text><text class="muted" x="8" y="131" font-size="29">Finder Quick Look, without opening another window.</text><rect class="s-blush" x="8" y="137" width="101" height="38" rx="10"/><text class="a-blush" x="23" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="23" font-weight="600">Swift</text><rect class="s-blush" x="121" y="137" width="115" height="38" rx="10"/><text class="a-blush" x="136" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="23" font-weight="600">AppKit</text><rect class="s-blush" x="248" y="137" width="172" height="38" rx="10"/><text class="a-blush" x="263" y="163" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="23" font-weight="600">Quick Look</text></svg>